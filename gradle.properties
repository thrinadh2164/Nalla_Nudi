# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line. Check Gradle settings in the IDE.
# For more details on how to configure your build environment visit
# http://www.gradle.org/configure-gradle-for-your-environment

# Gradle JVM compatibility
# Let Gradle auto-detect Java from PATH (Android Studio will set this automatically)
# org.gradle.java.home=

# Enable the new build cache
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Gradle project properties
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
